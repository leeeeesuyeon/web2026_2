<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="회원가입, HTML, form">
    <meta name="author" content="학생이름">
    <title>[이수연] - 사용자 등록</title>
</head>
<body>
    <header>
        <h1>사용자 등록 신청서</h1>
    </header>

    <main>
        <section>
            <article>
                <form action="#" method="post">
                    <fieldset>
                        <legend>기본 정보 (Essential)</legend>

                        <p>
                        <label for="userid">아이디:</label><br>
                        <input type="text" id="userid" name="userid" placeholder="4-12자 영문/숫자" required>
                        </p>

                        <p>
                        <label for="pw">비밀번호:</label><br>
                        <input type="password" id="pw" name="pw" required>
                        </p>

                        <p>
                        <label for="email">이메일:</label><br>
                        <input type="email" id="email" name="email" required>
                        </p>
                    </fieldset>

                    <br>

                    <fieldset>
                        <legend>부가 정보 (Optional)</legend>

                        <p>
                        <label for="phone">연락처:</label><br>
                        <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}">
                        </p>

                        <p>관심 분야:</p>
                        <input type="checkbox" id="html5" name="interest" value="HTML5">
                        <label for="html5">HTML5</label>

                        <input type="checkbox" id="css3" name="interest" value="CSS3">
                        <label for="css3">CSS3</label>

                        <input type="checkbox" id="javascript" name="interest" value="JavaScript">
                        <label for="javascript">JavaScript</label>

                        <p>
                        <label for="level">숙련도:</label><br>
                        <input type="range" id="level" name="level" min="1" max="10" step="1">
                        </p>
                    </fieldset>

                    <p>
                    <input type="submit" value="가입 신청">
                    <input type="reset" value="초기화">
                    </p>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p><a href="index.html">홈으로</a></p>
        <p>&copy; 2026 Web Programming Course. All rights reserved.</p>
    </footer>
</body>
</html>
